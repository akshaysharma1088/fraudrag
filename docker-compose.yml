version: "3.9"

services:
  # ── Backend API ─────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: fraudrag-api
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=fraudrag123
      - DATABASE_URL=postgresql+asyncpg://fraudrag:fraudrag@postgres:5432/fraudrag
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - BRONZE_RAW_PATH=/app/data/bronze
      - SILVER_NORMALIZED_PATH=/app/data/silver
      - GOLD_ANALYTICS_PATH=/app/data/gold
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - fraudrag-net
    restart: unless-stopped

  # ── Frontend ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: fraudrag-ui
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - fraudrag-net
    restart: unless-stopped

  # ── Neo4j Knowledge Graph ─────────────────────────────────
  neo4j:
    image: neo4j:5.20-community
    container_name: fraudrag-neo4j
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt
    environment:
      - NEO4J_AUTH=neo4j/fraudrag123
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2G
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      - fraudrag-net
    restart: unless-stopped

  # ── PostgreSQL Metadata Store ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: fraudrag-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=fraudrag
      - POSTGRES_PASSWORD=fraudrag
      - POSTGRES_DB=fraudrag
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudrag"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fraudrag-net
    restart: unless-stopped

  # ── Redis Cache ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fraudrag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - fraudrag-net
    restart: unless-stopped

  # ── Prometheus Monitoring ─────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: fraudrag-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - fraudrag-net
    restart: unless-stopped

  # ── Grafana Dashboards ────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: fraudrag-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=fraudrag
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - fraudrag-net
    restart: unless-stopped

volumes:
  neo4j-data:
  neo4j-logs:
  postgres-data:
  redis-data:
  grafana-data:

networks:
  fraudrag-net:
    driver: bridge
