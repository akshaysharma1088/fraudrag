# One-time GPT comparison of 20 SCRIPTED TEXT edits to licensed SYNTHETIC PDF sources.
# Trigger is restricted to creation of this workflow file only; $2 estimated reservation.
name: FraudRAG-v3 publisher PDF controlled-edit GPT pilot (one-time)
on:
  push:
    branches: [research/reproducibility-hardening-2026-10]
    paths: [.github/workflows/v3-gpt-paid-once.yml]
permissions:
  contents: read
concurrency:
  group: fraudrag-v3-single-paid-experiment-20261026
  cancel-in-progress: false
jobs:
  gpt-v3-60-requests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned lightweight PDF inference requirements
        run: python -m pip install 'pdfplumber>=0.11,<1' 'pytest>=8,<10'
      - name: Verify offline protocol and safety tests
        run: python -m pytest tests/test_v3_external_pdf.py tests/test_v3_pdf_gpt.py -q
      - name: Run controlled-edit GPT experiment (60 calls maximum, $2 estimated cap)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python experiments/v3_pdf_gpt.py --execute --budget 2
      - name: Preserve every answer and model usage record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fraudrag-v3-external-pdf-text-edit-gpt-60-results
          path: artifacts/v3_gpt/
          if-no-files-found: warn
          retention-days: 90
