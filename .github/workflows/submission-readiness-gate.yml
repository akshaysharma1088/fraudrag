name: FraudRAG scientific submission readiness and evidence freeze
on:
  push:
    branches: ['research/**']
    paths:
      - 'research/submission_readiness_gate.py'
      - 'tests/test_submission_readiness_gate.py'
      - '.github/workflows/submission-readiness-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scientific-release-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify that completed synthetic evidence is archived while journal release remains blocked
        run: python -m pip install 'pytest>=8,<10' && python -m pytest tests/test_submission_readiness_gate.py -q
      - name: Publish clear descriptive readiness report, not a false success badge
        run: |
          python research/submission_readiness_gate.py | tee publication_readiness_status.json
          echo "Research scripts and synthetic evidence are archived; REAL BANK-FRAUD publication clearance is still denied." >> "$GITHUB_STEP_SUMMARY"
      - name: Save signed-off preflight data (no confidential bank files)
        uses: actions/upload-artifact@v4
        with:
          name: fraudrag-scientific-submission-preflight-blocked
          path: publication_readiness_status.json
          retention-days: 90
