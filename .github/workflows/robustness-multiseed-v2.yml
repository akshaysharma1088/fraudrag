name: FraudRAG-v2 three-seed synthetic robustness evaluation
on:
  push:
    branches: ['research/**']
    paths:
      - 'benchmark/robustness_multiseed_v2.py'
      - 'tests/test_multiseed_v2.py'
      - '.github/workflows/robustness-multiseed-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  multi-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tests
        run: python -m pip install 'pytest>=8,<10'
      - name: Execute three independent held-out grouping seeds
        run: python benchmark/robustness_multiseed_v2.py
      - name: Validate reproducibility
        run: python -m pytest tests/test_multiseed_v2.py -q
      - name: Upload all per-case outputs
        uses: actions/upload-artifact@v4
        with:
          name: fraudrag-v2-robustness-525-synthetic-test-cases
          path: artifacts/fraudrag_v2_multiseed/
          retention-days: 90
