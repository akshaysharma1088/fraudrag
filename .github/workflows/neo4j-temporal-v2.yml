name: FraudRAG-v2 Neo4j temporal graph integration
on:
  push:
    branches: ['research/**']
    paths:
      - 'benchmark/neo4j_snapshot.py'
      - 'tests/integration_neo4j_v2.py'
      - '.github/workflows/neo4j-temporal-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  neo4j-temporal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      neo4j:
        image: neo4j:5.20-community
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports: ['7687:7687', '7474:7474']
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 15
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testpassword
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Neo4j Python driver
        run: python -m pip install 'neo4j>=5.20,<6'
      - name: Verify and run real Neo4j as-of-time graph queries
        run: python tests/integration_neo4j_v2.py
