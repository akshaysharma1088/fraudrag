name: LedgerShift publish results to branch
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run id of the LedgerShift benchmark run
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ledgershift-results
          path: out/results
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit results to ledgershift-results branch (one folder per run)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          mv out /tmp/out
          git fetch origin ledgershift-results && git checkout -B ledgershift-results origin/ledgershift-results || git checkout --orphan ledgershift-results
          mkdir -p runs/${{ inputs.run_id }}
          rm -rf runs/${{ inputs.run_id }}/results && mv /tmp/out/results runs/${{ inputs.run_id }}/results
          git add runs
          git commit -qm "LedgerShift results from run ${{ inputs.run_id }}"
          git push origin ledgershift-results
