name: Independent SEC AAER real accounting-fraud baseline (distinct task)
on:
  push:
    branches: ['research/**']
    paths:
      - 'experiments/aaer_external_baseline.py'
      - '.github/workflows/aaer-external.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-actual-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install metrics dependencies
        run: python -m pip install 'pandas>=2.1,<3' 'scikit-learn>=1.4,<2' 'numpy>=1.26,<3'
      - name: Download original published financial-accounting panel at pinned revision and evaluate
        run: python experiments/aaer_external_baseline.py
      - name: Avoid redistributing third-party underlying CSV
        run: rm -f artifacts/external_aaer/source_aaer_firm_year.csv
      - name: Archive only publication, SHA-256 and model scores
        uses: actions/upload-artifact@v4
        with:
          name: independent-real-sec-misstatement-baseline-not-bank-document-forgery
          path: artifacts/external_aaer/independent_aaer_metrics.json
          retention-days: 90
