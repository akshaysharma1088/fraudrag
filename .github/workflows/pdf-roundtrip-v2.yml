name: FraudRAG-v2 synthetic PDF extraction
on:
  push:
    branches: ['research/**']
    paths:
      - 'benchmark/pdf_roundtrip_v2.py'
      - '.github/workflows/pdf-roundtrip-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install document extraction dependencies
        run: python -m pip install 'reportlab>=4,<5' 'pdfplumber>=0.11,<1'
      - name: Generate fixed synthetic dataset
        run: python benchmark/evaluate_v2.py
      - name: Render and validate selected digital-PDF statements
        run: python benchmark/pdf_roundtrip_v2.py
      - name: Save sample PDFs and validation manifest
        uses: actions/upload-artifact@v4
        with:
          name: fraudrag-v2-digital-pdf-roundtrips
          path: artifacts/fraudrag_v2/pdf_validation/
          retention-days: 90
