# One-time independent audit of COMPLETED integrated GPT run #40366638447.
# Does not access an OpenAI key or issue any model requests.
name: FraudRAG-v2 final integrated evidence audit and archive
on:
  push:
    branches: [research/reproducibility-hardening-2026-10]
    paths: [.github/workflows/integrated-audit-once.yml]
permissions:
  contents: write
  actions: read
jobs:
  audit-and-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve complete input, prediction and model-usage artifacts
        uses: actions/download-artifact@v4
        with:
          name: fraudrag-v2-actual-neo4j-chroma-gpt-results
          run-id: 40366638447
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/integrated_archive
      - name: Independently validate all 112 case-mode predictions and provenance
        run: python benchmark/audit_integrated_v2.py --folder artifacts/integrated_archive
      - name: Require that all four experimental arms have complete coverage
        run: |
          python - <<'PY'
          import json,pathlib
          folder=pathlib.Path('artifacts/integrated_archive')
          recorded=json.loads((folder/'integrated_metrics.json').read_text())
          audited=json.loads((folder/'integrated_independent_audit.json').read_text())
          assert recorded['actual_calls']==112
          assert audited['observed_pair_count']==112
          assert len(audited['missing_pairs'])==0
          for mode in ('document_only','chroma_only','neo4j_only','integrated'):
              for item in ('tp','tn','fp','fn','abstain'):
                  assert recorded['results'][mode][item]==audited['per_condition'][mode][item]
          print('Independent audited metrics match recorded log for all four modes')
          PY
      - name: Commit permanently reproducible fictional records and results
        run: |
          mkdir -p research/verified_runs/fraudrag_v2_integrated_20261026
          cp artifacts/integrated_archive/{manifest.json,cases.csv,held_out_cases.csv,baseline_results.json,integrated_protocol.json,integrated_metrics.json,integrated_predictions.csv,integrated_independent_audit.json} research/verified_runs/fraudrag_v2_integrated_20261026/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/verified_runs/fraudrag_v2_integrated_20261026
          git commit -m "Archive independently checked real Neo4j Chroma GPT 112-call experiment"
          git pull --rebase origin research/reproducibility-hardening-2026-10
          git push origin HEAD:research/reproducibility-hardening-2026-10
      - name: Upload independently audited records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fraudrag-v2-integrated-audited-records
          path: artifacts/integrated_archive/
          if-no-files-found: warn
          retention-days: 90
