name: FraudRAG-v3 GPT PDF protocol dry run
on:
  push:
    branches: ['research/**']
    paths:
      - 'experiments/v3_pdf_gpt.py'
      - 'tests/test_v3_pdf_gpt.py'
      - '.github/workflows/v3-gpt-dry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF tooling
        run: python -m pip install 'pdfplumber>=0.11,<1' 'pytest>=8,<10'
      - name: Check fixed protocol with zero paid model calls
        run: python -m pytest tests/test_v3_pdf_gpt.py -q
      - name: Recheck pinned external PDFs, original versus modified cases, and cost preview
        run: python experiments/v3_pdf_gpt.py --budget 2
      - name: Archive preregistered experiment settings
        uses: actions/upload-artifact@v4
        with:
          name: fraudrag-v3-gpt-dry-protocol
          path: artifacts/v3_gpt/protocol.json
          retention-days: 90
