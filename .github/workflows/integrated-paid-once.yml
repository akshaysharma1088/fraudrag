# ONE-TIME ACTUAL INTEGRATED GPT STUDY, after passing independent dry run #40366292505
# Paid GPT calls are capped by the conservative per-call estimate ($2).
name: FraudRAG-v2 actual Neo4j Chroma GPT pilot (one-time)
on:
  push:
    branches: [research/reproducibility-hardening-2026-10]
    paths: [.github/workflows/integrated-paid-once.yml]
permissions:
  contents: read
concurrency:
  group: fraudrag-v2-actual-integrated-paid-once
  cancel-in-progress: false
jobs:
  integrated-paid:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      neo4j:
        image: neo4j:5.20-community
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports: ['7687:7687', '7474:7474']
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 15
    env:
      NEO4J_PASSWORD: testpassword
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install integration dependencies
        run: python -m pip install 'chromadb==1.5.5' 'scikit-learn>=1.4,<2' 'neo4j>=5.20,<6' 'pytest>=8,<10'
      - name: Recheck integration and contamination tests (no GPT calls)
        run: python -m pytest tests/test_integrated_protocol_v2.py -q
      - name: Run four paired ACTUAL Neo4j Chroma GPT conditions, max $2 estimated budget
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python experiments/fraudrag_v2_integrated.py --execute --budget 2.0
      - name: Preserve complete raw output and provenance even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fraudrag-v2-actual-neo4j-chroma-gpt-results
          path: artifacts/fraudrag_v2_integrated/
          if-no-files-found: warn
          retention-days: 90
