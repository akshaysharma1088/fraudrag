name: FraudRAG-v2 Chroma historical vector integration
on:
  push:
    branches: ['research/**']
    paths:
      - 'benchmark/chroma_historical_v2.py'
      - 'tests/integration_chroma_v2.py'
      - '.github/workflows/chroma-historical-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chroma-historical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chroma and deterministic feature-hashing dependencies
        run: python -m pip install 'chromadb==1.5.5' 'scikit-learn>=1.4,<2'
      - name: Execute actual Chroma historical retrieval
        run: python tests/integration_chroma_v2.py
