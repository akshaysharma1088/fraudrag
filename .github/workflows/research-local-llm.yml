name: Open-weight LLM financial-claims pilot
on:
  push:
    branches: ['research/**']
    paths:
      - 'experiments/llm_local_finfact.py'
      - '.github/workflows/research-local-llm.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-llm:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m py_compile experiments/finfact_study.py experiments/llm_local_finfact.py
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install model and evaluation dependencies
        run: python -m pip install 'transformers==4.46.3' 'scikit-learn>=1.4,<2' 'safetensors>=0.4' 
      - name: Run open-weight LLM on pinned external dataset
        run: python experiments/llm_local_finfact.py --model Qwen/Qwen2.5-0.5B-Instruct --limit 24
      - name: Upload LLM predictions and paired metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-05b-finfact-claim-only-pilot
          path: artifacts/finfact_local_llm/
          if-no-files-found: warn
          retention-days: 90
