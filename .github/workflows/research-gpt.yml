name: GPT Fin-Fact paired evaluation
on:
  push:
    branches: ['research/**']
    paths:
      - 'experiments/gpt_finfact_study.py'
      - '.github/workflows/research-gpt.yml'
  workflow_dispatch:
    inputs:
      execute_paid_api:
        description: 'Perform paid GPT inference? Must be explicitly true.'
        type: boolean
        required: true
        default: false
      model:
        description: 'Select GPT model'
        type: choice
        required: true
        default: 'gpt-6.1-sol'
        options:
          - gpt-6.1-sol
          - gpt-6-luna
      limit:
        description: 'Maximum paired held-out test claims'
        type: number
        default: 24
      max_budget_usd:
        description: 'Conservative cost cap in USD (the API cannot enforce exact account billing)'
        type: number
        default: 2
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install evaluation dependency
        run: python -m pip install 'scikit-learn>=1.4,<2'
      - name: Syntax check and cost preview (no paid API calls)
        run: |
          python -m py_compile experiments/gpt_finfact_study.py
          python experiments/gpt_finfact_study.py --model gpt-6.1-sol --limit 24
  paid-gpt-evaluation:
    if: github.event_name == 'workflow_dispatch' && inputs.execute_paid_api == true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install evaluation dependency
        run: python -m pip install 'scikit-learn>=1.4,<2'
      - name: Paid GPT evaluation (only after explicit manual trigger)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_NAME: ${{ inputs.model }}
          TEST_LIMIT: ${{ inputs.limit }}
          BUDGET_USD: ${{ inputs.max_budget_usd }}
        run: |
          python experiments/gpt_finfact_study.py --execute --model "$MODEL_NAME" \
            --limit "$TEST_LIMIT" --max-estimated-usd "$BUDGET_USD"
      - name: Upload paired predictions, metrics and usage cost
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt-finfact-paired-results
          path: artifacts/finfact_gpt/
          if-no-files-found: warn
          retention-days: 90
