name: FraudRAG-v2 reproducible synthetic benchmark
on:
  push:
    branches: ['research/**']
    paths:
      - 'benchmark/fraudrag_v2.py'
      - 'benchmark/evaluate_v2.py'
      - 'tests/test_fraudrag_v2.py'
      - '.github/workflows/benchmark-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  empirical-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install evaluation tools
        run: python -m pip install 'pytest>=8,<10' 'scikit-learn>=1.4,<2'
      - name: Check source compilation
        run: python -m py_compile benchmark/fraudrag_v2.py benchmark/evaluate_v2.py
      - name: Verify generator, timing and leakage controls
        run: python -m pytest tests/test_fraudrag_v2.py -q
      - name: Execute actual reproducible deterministic baselines
        run: python benchmark/evaluate_v2.py --customers 120 --n-per-type 4
      - name: Upload synthetic corpus and machine-readable outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fraudrag-v2-synthetic-evaluation
          path: artifacts/fraudrag_v2/
          if-no-files-found: warn
          retention-days: 90
