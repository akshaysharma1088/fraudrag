name: FraudRAG-v2 missing authoritative evidence stress test
on:
  push:
    branches: ['research/**']
    paths:
      - 'benchmark/incomplete_evidence_v2.py'
      - 'tests/test_incomplete_v2.py'
      - '.github/workflows/incomplete-evidence-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  incomplete-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tests
        run: python -m pip install 'pytest>=8,<10'
      - name: Check missing-evidence logic
        run: python -m pytest tests/test_incomplete_v2.py -q
      - name: Execute controlled synthetic evidence-availability conditions
        run: python benchmark/incomplete_evidence_v2.py
      - name: Retain all predictions and metrics
        uses: actions/upload-artifact@v4
        with:
          name: fraudrag-v2-missing-ledger-stress
          path: artifacts/fraudrag_v2_incomplete/
          retention-days: 90
