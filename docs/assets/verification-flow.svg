</g>
<g fill="#0f3558" font-size="19" font-weight="700" text-anchor="middle">
<text x="115" y="119">Submitted claim</text>
<text x="320" y="119">Source planning</text>
<text x="525" y="113">Independent</text><text x="525" y="136">references</text>
<text x="730" y="119">Evidence contract</text>
<text x="935" y="119">Verifier</text>
<text x="1140" y="119">Decision state</text>
</g>
