<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 330" role="img" aria-labelledby="archTitle archDesc">
<title id="archTitle">Conditional evidence verification workflow</title>
<desc id="archDesc">Input claim leads to source planning, independently sourced references, evidence admissibility checks, deterministic comparison and four conditional outcomes.</desc>
